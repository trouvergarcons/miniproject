<!DOCTYPE html>
<html>

<head>
  <title>Verasity Configuration</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      padding: 24px;
      min-width: 300px;
      background: #09090b;
      color: #f8fafc;
      margin: 0;
    }

    h1 {
      font-size: 1.25rem;
      margin-top: 0;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #10b981, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 0.875rem;
      color: #a1a1aa;
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.875rem;
      font-weight: 500;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 16px;
      border: 1px solid #27272a;
      border-radius: 6px;
      box-sizing: border-box;
      background: #18181b;
      color: #f8fafc;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px #3b82f6;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #f8fafc;
      color: #09090b;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #e2e8f0;
    }

    #status {
      margin-top: 12px;
      text-align: center;
      font-size: 0.875rem;
      height: 20px;
    }

    .success {
      color: #10b981;
    }

    .error {
      color: #ef4444;
    }
  </style>
</head>

<body>
  <h1>Verasity</h1>
  <p>Minimal configuration to connect your extension.</p>
  <div>
    <label for="serverUrl">Server URL</label>
    <input type="text" id="serverUrl" placeholder="http://localhost:3000">

    <label for="apiKey">API Token</label>
    <input type="text" id="apiKey" placeholder="vr_...">

    <button id="saveBtn">Save Configuration</button>
    <div id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
